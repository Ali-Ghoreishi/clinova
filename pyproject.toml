
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = ["F401"]

[project]
name = "clinova"
version = "0.1.0"
description = "Online Clinic Appointment Booking System"
requires-python = ">=3.12"